<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body style="margin: 0; padding: 24px; background: #f4f4f5; font-family: Arial, sans-serif">
    <table width="100%" style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden">
      <tr>
        <td style="padding:20px 24px; background:{{severityColor}}; color:#ffffff;">
          <strong>{{title}}</strong>
        </td>
      </tr>
      <tr>
        <td style="padding: 24px; color: #27272a; font-size: 15px; line-height: 1.5">{{message}}</td>
      </tr>
      <tr>
        <td style="padding: 16px 24px; background: #fafafa; color: #71717a; font-size: 12px">
          Notifica automatica del gestionale EDG — Modulo Asset Aziendali.
        </td>
      </tr>
    </table>
  </body>
</html>
